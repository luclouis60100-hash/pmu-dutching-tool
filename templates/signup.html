<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - PMUDutchingTool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .signup-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: #667eea;
            font-weight: bold;
        }
        
        h2 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .password-info {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }
        
        .btn-signup {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        
        .btn-signup:hover {
            background: #5568d3;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }
        
        .terms {
            font-size: 0.85rem;
            color: #666;
            margin-top: 15px;
            text-align: center;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.95rem;
        }
        
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .back-link {
            text-align: center;
            margin-top: 15px;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        /* MOBILE RESPONSIVE */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .signup-container {
                padding: 25px 15px;
                max-width: 100%;
                border-radius: 10px;
            }
            
            .logo h1 {
                font-size: 1.5rem;
            }
            
            h2 {
                font-size: 1.3rem;
                margin-bottom: 20px;
            }
            
            .form-group {
                margin-bottom: 15px;
            }
            
            input[type="email"],
            input[type="password"] {
                padding: 14px;
                font-size: 16px;
            }
            
            .btn-signup {
                padding: 14px;
                font-size: 1.05rem;
            }
            
            .login-link,
            .back-link {
                font-size: 0.9rem;
                margin-top: 12px;
            }
            
            .terms {
                font-size: 0.8rem;
            }
        }
        
        @media (max-width: 768px) {
            .signup-container {
                max-width: 100%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <h1>🏇 PMUDutchingTool</h1>
            <p>Analyse & Dutching PMU</p>
        </div>
        
        <h2>Créer un compte</h2>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="ton@email.com">
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
                <div class="password-info">Minimum 6 caractères</div>
            </div>
            
            <div class="form-group">
                <label for="password_confirm">Confirmer le mot de passe</label>
                <input type="password" id="password_confirm" name="password_confirm" required placeholder="••••••••">
            </div>
            
            <div class="terms">
                En créant un compte, tu acceptes nos conditions d'utilisation
            </div>
            
            <button type="submit" class="btn-signup">Créer mon compte</button>
        </form>
        
        <div class="login-link">
            Déjà inscrit ? <a href="/login">Se connecter</a>
        </div>
        
        <div class="back-link">
            <a href="/pricing">← Retour aux tarifs</a>
        </div>
    </div>
</body>
</html>
